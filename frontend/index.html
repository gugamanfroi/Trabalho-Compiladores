<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Software Educacional - Python</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f6f8; }
        .card { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        #mensagem { font-size: 1.2em; color: #16a085; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Projeto Educacional (Python - Aritmética)</h1>
        <p id="mensagem">Carregando...</p>
    </div>

    <script>
        fetch('http://localhost:5000/')
            .then(response => response.json())
            .then(data => {
                document.getElementById('mensagem').innerText = data.message;
            })
            .catch(error => {
                document.getElementById('mensagem').innerText = "Erro ao conectar com o backend.";
                console.error('Erro:', error);
            });
    </script>
</body>
</html>
