<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compilador Educacional — Python</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Compilador Educacional</h1>
    <p id="linguagem" class="linguagem">
      Linguagem analisada: <strong>Python</strong> — subconjunto com atribuições, expressões aritméticas e condicionais
    </p>
  </header>

  <main class="painel">
    <section class="editor" aria-labelledby="titulo-editor">
      <h2 id="titulo-editor">Código-fonte</h2>

      <div class="linha-exemplo">
        <label for="seletor-exemplo">Carregar exemplo</label>
        <select id="seletor-exemplo">
          <option value="">Selecione um exemplo…</option>
        </select>
      </div>
      <p id="descricao-exemplo" class="descricao-exemplo"></p>

      <label for="codigo" class="sr-only">Código-fonte a ser analisado</label>
      <textarea id="codigo" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"
        placeholder="Digite ou cole um programa Python aqui&#10;&#10;Exemplo:&#10;numero = 10&#10;print(numero)"></textarea>

      <div class="acoes">
        <button id="btn-analisar" type="button" class="primario">Analisar código</button>
        <button id="btn-limpar" type="button" class="secundario">Limpar</button>
        <span id="contador" class="contador" aria-live="off"></span>
      </div>
    </section>

    <section class="resultados" aria-labelledby="titulo-resultado">
      <h2 id="titulo-resultado">Resultado</h2>
      <div id="resultado" role="status" aria-live="polite" data-estado="inicial"></div>
    </section>
  </main>

  <footer class="rodape">
    Etapa 2 — o código é enviado ao servidor e validado. Análises léxica, sintática e semântica ainda não implementadas.
  </footer>

  <script src="js/validacao.js"></script>
  <script src="js/exemplos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
